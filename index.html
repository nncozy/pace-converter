<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0e08" id="theme-color-meta">
<meta name="description" content="距離のタイムを入力すると、同じペースで走った場合の他の距離のタイムを瞬時に自動計算するランナー向けツール。">
<title>ペース相互換算計算機 | Pace Converter</title>

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pace Converter">
<meta name="mobile-web-app-capable" content="yes">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Pace Converter">
<meta property="og:locale" content="ja_JP">
<meta property="og:title" content="ペース相互換算計算機 | Pace Converter">
<meta property="og:description" content="距離のタイムを入力すると、同じペースで走った場合の他の距離のタイムを瞬時に自動計算するランナー向けツール。">
<meta property="og:url" content="https://nncozy.github.io/pace-converter/">
<meta property="og:image" content="https://nncozy.github.io/pace-converter/icons/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="ペース相互換算計算機 | Pace Converter">
<meta name="twitter:description" content="距離のタイムを入力すると、同じペースで走った場合の他の距離のタイムを瞬時に自動計算するランナー向けツール。">
<meta name="twitter:image" content="https://nncozy.github.io/pace-converter/icons/og-image.png">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { darkMode: 'class' };
</script>
<script>
  // テーマ確定を描画前に行い、切り替え時のちらつきを防ぐ
  (function () {
    try {
      var stored = localStorage.getItem('paceConverter.theme');
      var isDark = stored === 'dark' ||
        (stored !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (isDark) {
        document.documentElement.classList.add('dark');
      } else {
        document.getElementById('theme-color-meta').setAttribute('content', '#f7faf2');
      }
    } catch (e) {}
  })();
</script>
<link rel="stylesheet" href="css/style.css?v=11">
</head>
<body class="bg-[#f7faf2] dark:bg-[#0a0e08] text-neutral-900 dark:text-white min-h-screen antialiased transition-colors">
  <div class="max-w-md mx-auto px-4 pt-6 pb-16 animate-fade-in-up">
    <header class="mb-5">
      <div class="flex items-center justify-between gap-2 mb-4">
        <button id="edit-distances-btn" type="button" aria-label="距離を編集"
          class="w-9 h-9 shrink-0 flex items-center justify-center rounded-full bg-white/80 dark:bg-neutral-900/80 backdrop-blur-sm border border-lime-600/15 dark:border-lime-400/15 text-neutral-600 dark:text-neutral-300 shadow-sm shadow-lime-900/5 dark:shadow-black/40 hover:-translate-y-0.5 active:translate-y-0 active:scale-95 transition">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
            <line x1="4" y1="6" x2="20" y2="6"></line>
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <line x1="4" y1="18" x2="20" y2="18"></line>
            <circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"></circle>
            <circle cx="16" cy="12" r="2" fill="currentColor" stroke="none"></circle>
            <circle cx="10" cy="18" r="2" fill="currentColor" stroke="none"></circle>
          </svg>
        </button>

        <h1 class="text-2xl font-black tracking-tight text-center flex-1 truncate bg-gradient-to-r from-lime-600 to-green-500 dark:from-lime-400 dark:to-green-300 bg-clip-text text-transparent">
          PACE CONVERTER
        </h1>

        <button id="theme-toggle-btn" type="button" aria-label="テーマを切り替え"
          class="w-9 h-9 shrink-0 flex items-center justify-center rounded-full bg-white/80 dark:bg-neutral-900/80 backdrop-blur-sm border border-lime-600/15 dark:border-lime-400/15 text-neutral-600 dark:text-neutral-300 shadow-sm shadow-lime-900/5 dark:shadow-black/40 hover:-translate-y-0.5 active:translate-y-0 active:scale-95 transition"></button>
      </div>
      <p class="text-xs text-center text-neutral-500 dark:text-neutral-400 leading-relaxed">
        どこかの距離のタイムを入力すると、同じペースの他の距離のタイムが自動計算されます
      </p>
      <div class="flex flex-wrap justify-center gap-1.5 mt-3">
        <span class="rounded-full border border-lime-600/20 dark:border-lime-400/20 bg-white/70 dark:bg-neutral-900/70 backdrop-blur-sm px-2.5 py-1 text-[10px] font-semibold text-lime-700 dark:text-lime-300 shadow-sm shadow-lime-900/5">🔓 ログイン不要</span>
        <span class="rounded-full border border-lime-600/20 dark:border-lime-400/20 bg-white/70 dark:bg-neutral-900/70 backdrop-blur-sm px-2.5 py-1 text-[10px] font-semibold text-lime-700 dark:text-lime-300 shadow-sm shadow-lime-900/5">📱 ホーム画面に追加OK</span>
        <span class="rounded-full border border-lime-600/20 dark:border-lime-400/20 bg-white/70 dark:bg-neutral-900/70 backdrop-blur-sm px-2.5 py-1 text-[10px] font-semibold text-lime-700 dark:text-lime-300 shadow-sm shadow-lime-900/5">⚡ 瞬時に自動計算</span>
      </div>
    </header>

    <div class="mb-2 text-center">
      <div class="inline-flex items-baseline gap-1 rounded-2xl bg-gradient-to-r from-lime-600 to-green-500 dark:from-lime-400 dark:to-green-300 pl-4 pr-3 py-2 shadow-md shadow-lime-600/30 dark:shadow-lime-400/20">
        <input id="pace-min-input" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="999" placeholder="--"
          aria-label="1kmあたりの分"
          class="pace-summary-input w-10 bg-transparent text-white dark:text-neutral-950 text-2xl font-black font-mono tabular-nums text-right focus:outline-none placeholder:text-white/70 dark:placeholder:text-neutral-950/50">
        <span class="text-white dark:text-neutral-950 text-2xl font-black">'</span>
        <input id="pace-sec-input" type="number" inputmode="numeric" pattern="[0-9]*" min="0" max="59" placeholder="--"
          aria-label="1kmあたりの秒"
          class="pace-summary-input w-9 bg-transparent text-white dark:text-neutral-950 text-2xl font-black font-mono tabular-nums focus:outline-none placeholder:text-white/70 dark:placeholder:text-neutral-950/50">
        <span class="text-white dark:text-neutral-950 text-2xl font-black">"</span>
        <span class="text-white/85 dark:text-neutral-950/70 text-xs font-bold ml-1 self-center">/ km</span>
      </div>
      <p class="text-[10px] text-neutral-400 dark:text-neutral-600 mt-1">ここに直接ペースを入力してもOK</p>
    </div>

    <div class="mb-4 flex flex-col items-center gap-1">
      <button id="vdot-btn" type="button"
        class="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-white/80 dark:bg-neutral-900/80 backdrop-blur-sm border border-lime-600/15 dark:border-lime-400/15 text-neutral-600 dark:text-neutral-300 text-xs font-semibold shadow-sm shadow-lime-900/5 dark:shadow-black/40 hover:-translate-y-0.5 active:translate-y-0 active:scale-95 transition">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
          <circle cx="12" cy="12" r="9"></circle>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="12" cy="12" r="0.5" fill="currentColor"></circle>
        </svg>
        トレーニングペースを計算
      </button>
      <p class="text-[10px] text-neutral-400 dark:text-neutral-600">お試し機能・使わなくてもOK</p>
    </div>

    <div id="distance-list" class="space-y-3"></div>

    <div class="mt-6 flex justify-center">
      <button id="reset-btn" type="button"
        class="px-5 py-2.5 rounded-full bg-white/80 dark:bg-neutral-900/80 backdrop-blur-sm border border-lime-600/15 dark:border-lime-400/15 text-neutral-600 dark:text-neutral-300 text-sm font-semibold shadow-sm shadow-lime-900/5 dark:shadow-black/40 hover:-translate-y-0.5 active:translate-y-0 active:bg-neutral-100 dark:active:bg-neutral-800 active:scale-95 transition">
        すべてリセット
      </button>
    </div>

    <footer class="mt-8 text-center text-[11px] leading-relaxed text-neutral-400 dark:text-neutral-600">
      <p>hh : mm : ss . ミリ秒（2桁）の形式で入力してください。</p>
      <p>2桁入力すると自動的に次の欄へ移動します。</p>
    </footer>
  </div>

  <script src="js/app.js?v=11"></script>
  <script>
    // 電波の弱い場所でも起動できるよう、アプリ本体をService Workerでキャッシュする
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
